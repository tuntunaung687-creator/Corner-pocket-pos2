name: Build Corner Pocket APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android Project
        run: |
          unzip -q Corner_Pocket_POS_Android_Project_15_Tables.zip -d extracted
          cp -R extracted/CornerPocketAndroid/. .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Corner-Pocket-POS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
